# 配置文件示例
# 复制为 config.yaml 并根据需要修改

# 运行环境: development, testing, production
app_env: "development"

# MCP 服务器配置
mcp:
  server_name: "QiuChi"
  transport: "streamable-http"  # stdio, sse, streamable-http
  host: "0.0.0.0"
  port: 8888
  json_response: true

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  output: "both"  # stderr, file, both
  file_path: "logs/x-QiuChi_{time:YYYY-MM-DD-HH}.log"
  rotation: "1 hour"
  retention: "7 days"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{file.name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"

# 功能开关
features:
  middleware: true

# 插件配置
plugins:
  auto_discovery: true
  discovery_paths:
    - "src.plugins.builtin"
  enabled_plugins: []  # 空列表表示启用所有
  disabled_plugins: []  # 禁用的插件列表

# 中间件配置
middleware:
  auth:
    enabled: false
    tokens: []  # 有效 Bearer Token 列表（enabled: true 时必填，如 ["dev-token"]）

# 汉江管理系统适配器配置（HTTP 转接代理：认证 + 用户管理）
hanjiang:
  base_url: "http://localhost:8000"  # 汉江管理系统后端地址
  username: ""                        # 服务凭据账号（管理员，敏感值优先放 .env）
  password: ""                        # 服务凭据密码（敏感值优先放 .env）
  encryption_enabled: true            # 是否 RSA-OAEP 加密密码（与汉江 AUTH_ENCRYPTION_ENABLED 保持一致）
  timeout: 30                         # 请求超时（秒）