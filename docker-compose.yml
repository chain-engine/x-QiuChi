services:
  qiuchi-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qiuchi-mcp
    ports:
      - "${MCP_PORT:-8888}:${MCP_PORT:-8888}"
    environment:
      # 服务器配置
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-QiuChi}
      - MCP_VERSION=${MCP_VERSION:-1.0.0}
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8888}

      # 日志配置
      - LOGGING_LEVEL=${LOGGING_LEVEL:-INFO}
      - LOGGING_OUTPUT=${LOGGING_OUTPUT:-both}

      # 天气 API 密钥（可选）
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}

      # Python 路径
      - PYTHONPATH=/app/src
    volumes:
      # 挂载日志目录（可选）
      - qiuchi-logs:/app/logs
      # 挂载配置文件（可选，如需自定义配置）
      # - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, os, sys; r = httpx.post('http://localhost:' + os.environ.get('MCP_PORT', '8888') + '/mcp', json={'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'healthcheck','version':'1.0'}}}, headers={'Accept':'application/json, text/event-stream'}, timeout=5); sys.exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qiuchi-logs: